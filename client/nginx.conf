server {
    listen 5173;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # try_files' fallback to /index.html is an internal redirect, so it's
    # actually served by whichever location matches "/index.html" on
    # rematch (this exact-match block, not the prefix location that
    # triggered the fallback). Pin no-store here so the SPA shell is never
    # cached under any entry path — needed so /b/{code}'s dual-purpose route
    # (see below) can't have its HTML shell response reused by axios's JSON
    # XHR to the same URL.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        proxy_pass http://server:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /b/{code} is both the SPA route that renders the shared-board page and
    # the API the page calls (via axios) to resolve the code to a board. A
    # browser navigating to the link wants the app shell (text/html); the
    # app's own XHR for board data wants JSON from the backend. Route on the
    # Accept header sent by the client to tell the two apart.
    location /b/ {
        if ($http_accept !~* "^text/html") {
            rewrite ^/b/(.*)$ /__board_api/$1 last;
        }
        try_files $uri /index.html;
    }

    location /__board_api/ {
        internal;
        add_header Cache-Control "no-store" always;
        proxy_pass http://server:8000/b/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://server:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
